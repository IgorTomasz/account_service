version: '3.4'

services:
  account_service:
    build:
        context: .
        dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
      - "8081:8081" 
    depends_on:
      - sqlserv
    networks:
      - produktnetwork
    restart: on-failure

  sqlserv:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
        MSSQL_SA_PASSWORD: "Pa$$word123!@#"
        ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver:/var/opt/account_service_sqlserver
    networks:
      - produktnetwork
networks:
  produktnetwork:    

volumes:
  sqlserver:    